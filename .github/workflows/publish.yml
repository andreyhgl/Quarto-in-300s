name: Render and deploy

on:
  push:
    branches:
      - main

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install R packages from DESCRIPTION-file
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Setup Quarto
      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        run: quarto render quarto-in-300-seconds.qmd --to revealjs

      - name: Prepare site
        run: |
          mkdir -p _site
          cp quarto-in-300-seconds.html _site/index.html
          cp -r quarto-in-300-seconds_files _site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
